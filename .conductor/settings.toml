"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "COMPOSER_NO_INTERACTION=1 composer setup"
archive = "true"
run_mode = "concurrent"

[scripts.run.dev]
command = 'APP_URL="http://127.0.0.1:$CONDUCTOR_PORT" INERTIA_SSR_URL="http://127.0.0.1:$((CONDUCTOR_PORT+2))" bunx concurrently -c "#93c5fd,#c4b5fd,#fb7185,#fdba74" "php artisan serve --host=127.0.0.1 --port=$CONDUCTOR_PORT" "php artisan queue:listen --tries=1" "php artisan pail --timeout=0" "bun run dev" --names=server,queue,logs,vite --kill-others'
default = true
icon = "play"

[scripts.run.test]
command = "php artisan test --compact"
icon = "test-tube"

[scripts.run.check]
command = "COMPOSER_NO_INTERACTION=1 composer test"
icon = "shield-check"

[scripts.run.lint]
command = "COMPOSER_NO_INTERACTION=1 composer lint"
icon = "wrench"
